name: Arch package and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git python
      - uses: actions/checkout@v4
      - name: Validate Python syntax and translation catalog
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          for path in Path('src').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          json.loads(Path('packaging/translations.json').read_text(encoding='utf-8'))
          PY
      - name: Build Arch package
        env:
          HANDHELDDASH_REF: commit=${{ github.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(bash -c 'source PKGBUILD; echo "$pkgver"')
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo 'Tag and PKGBUILD version differ'; exit 1; }
          fi
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Runtime dependencies include Thor-only BSP packages unavailable in generic Arch.
          runuser -u builder -- env HANDHELDDASH_REF="$HANDHELDDASH_REF" makepkg --nodeps --force
          # Verify new UI modules are actually in the distributable package.
          tar -tf ./*.pkg.tar.zst > package-files.txt
          grep -Fx 'usr/lib/aynthor/handhelddash/ui/widgets/affinity.py' package-files.txt
          grep -Fx 'usr/lib/aynthor/handhelddash/ui/widgets/paging.py' package-files.txt
          sha256sum ./*.pkg.tar.zst > SHA256SUMS
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
      - uses: actions/upload-artifact@v4
        with:
          name: handhelddash-arch
          path: |
            *.pkg.tar.zst
            SHA256SUMS
            .SRCINFO
          if-no-files-found: error
          include-hidden-files: true
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: handhelddash-arch
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* dist/.SRCINFO \
            --verify-tag --title "HandheldDash $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
